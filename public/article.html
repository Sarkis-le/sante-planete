<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Santé Planète – Article</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="logo.png" />
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
  <div id="siteHeader"></div>

  <section class="detail-wrap">
    <div class="container">
      <article class="detail" id="articleDetail">
        <div class="empty-state">Chargement…</div>
      </article>
    </div>
  </section>

  <div id="siteFooter"></div>

  <script src="/assets/app.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      SP.setActiveNav("articles");
      loadArticle();
    });

    async function loadArticle(){
      const el = document.getElementById("articleDetail");
      const params = new URLSearchParams(location.search);
      const slug = params.get("slug");
      if(!slug){
        el.innerHTML = '<div class="empty-state error-state">Slug manquant.</div><a class="back-link" href="/articles.html">Retour</a>';
        return;
      }

      try{
        // si tu as déjà /api/articles (liste), on peut fallback dessus
        let art = null;

        // 1) essaye endpoint détail si tu le crées
        try{
          const r1 = await fetch("/api/articles/" + encodeURIComponent(slug));
          if(r1.ok) art = await r1.json();
        }catch{}

        // 2) fallback liste
        if(!art){
          const r2 = await fetch("/api/articles");
          if(!r2.ok) throw new Error("API KO");
          const list = await r2.json();
          art = (Array.isArray(list) ? list.find(a => a.slug === slug) : null);
        }

        if(!art){
          el.innerHTML = '<div class="empty-state error-state">Article introuvable.</div><a class="back-link" href="/articles.html">Retour</a>';
          return;
        }

        const contentHtml = (art.content || "").trim();
        const chapo = art.summary || "";

        el.innerHTML = "";

        const h1 = document.createElement("h1");
        h1.textContent = art.title || "Article";

        const meta = document.createElement("p");
        meta.className = "meta-line";

        const author = document.createElement("span");
        author.textContent = art.author || "Sante-Planète";

        const date = document.createElement("span");
        const d = SP.formatDate(art.createdAt);
        if(d) date.textContent = d;

        const read = document.createElement("span");
        read.textContent = SP.estimateReadingTime(contentHtml || chapo);

        const cat = document.createElement("span");
        cat.textContent = art.category || "Santé";

        meta.appendChild(author);
        if(d) meta.appendChild(date);
        meta.appendChild(read);
        meta.appendChild(cat);

        el.appendChild(h1);
        el.appendChild(meta);

        if(art.imageUrl){
          const img = document.createElement("img");
          img.className = "detail-cover";
          img.src = art.imageUrl;
          img.alt = art.title || "Illustration";
          img.loading = "lazy";
          el.appendChild(img);
        }

        if(chapo){
          const p = document.createElement("p");
          p.className = "chapo";
          p.textContent = chapo;
          el.appendChild(p);
        }

        if(contentHtml){
          const wrap = document.createElement("div");
          wrap.innerHTML = contentHtml; // contenu HTML admin
          el.appendChild(wrap);
        }else{
          el.appendChild(makeEmpty("Contenu en cours de rédaction."));
        }

        const back = document.createElement("a");
        back.href = "/articles.html";
        back.className = "back-link";
        back.textContent = "Retour aux articles";
        el.appendChild(back);

        window.scrollTo({ top: 0, behavior: "smooth" });
      }catch(e){
        el.innerHTML = '<div class="empty-state error-state">Erreur de chargement.</div><a class="back-link" href="/articles.html">Retour</a>';
      }
    }

    function makeEmpty(txt){
      const d = document.createElement("div");
      d.className = "empty-state";
      d.textContent = txt;
      return d;
    }
  </script>
</body>
</html>
