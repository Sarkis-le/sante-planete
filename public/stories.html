<style>
/* ===== HERO STORIES ===== */
.stories-hero{
  background: linear-gradient(135deg, #020617, #0f172a, #1e293b);
  color: #fff;
  padding: 42px 0 26px 0;
  border-bottom: 1px solid rgba(148,163,184,.18);
}

.stories-hero__top{
  display:flex;
  gap: 18px;
  align-items:flex-end;
  justify-content: space-between;
  flex-wrap: wrap;
}

.stories-hero__title h1{
  margin: 0;
  font-size: 1.8rem;
  font-weight: 900;
  letter-spacing: .2px;
}

.stories-hero__title p{
  margin: .5rem 0 0 0;
  color: #cbd5e1;
  max-width: 62ch;
}

.stories-search{
  display:flex;
  gap: 10px;
  align-items:center;
  flex-wrap: wrap;
}

.stories-search input{
  width: min(520px, 80vw);
  padding: 12px 14px;
  border-radius: 14px;
  border: 1px solid rgba(148,163,184,.28);
  background: rgba(15,23,42,.55);
  color: #e5e7eb;
  outline: none;
}

.stories-search input::placeholder{
  color: rgba(203,213,225,.75);
}

.stories-btn{
  padding: 12px 14px;
  border-radius: 14px;
  border: 1px solid rgba(56,189,248,.35);
  background: rgba(56,189,248,.14);
  color: #e5e7eb;
  font-weight: 800;
  cursor: pointer;
}

.stories-btn:hover{
  transform: translateY(-1px);
}

.stories-filters{
  display:flex;
  gap: 10px;
  margin-top: 12px;
  flex-wrap: wrap;
}

.filter-chip{
  padding: 8px 12px;
  border-radius: 999px;
  border: 1px solid rgba(148,163,184,.24);
  background: rgba(15,23,42,.5);
  color: #e5e7eb;
  font-weight: 800;
  cursor:pointer;
}

.filter-chip.is-active{
  border-color: rgba(56,189,248,.55);
  background: rgba(56,189,248,.18);
}

/* ===== Stories Feed (style Facebook) ===== */
.stories-feed{
  display: grid;
  grid-template-columns: 1fr;
  gap: 18px;
  max-width: 860px;
  margin: 0 auto;
}

.story-post{
  background: rgba(15, 23, 42, 0.68);
  border: 1px solid rgba(148, 163, 184, 0.25);
  border-radius: 18px;
  overflow: hidden;
  box-shadow: 0 18px 50px rgba(0,0,0,.25);
  backdrop-filter: blur(6px);
}

.story-post__head{
  display:flex;
  gap: 12px;
  align-items:center;
  padding: 14px 16px;
}

.story-post__avatar{
  width: 44px;
  height: 44px;
  border-radius: 999px;
  background: rgba(56,189,248,.15);
  border: 1px solid rgba(56,189,248,.35);
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight: 900;
  color: #e5e7eb;
  flex: 0 0 auto;
}

.story-post__meta{
  flex: 1 1 auto;
  min-width: 0;
}

.story-post__title{
  margin: 0;
  font-size: 1.05rem;
  font-weight: 900;
  color: #fff;
  line-height: 1.2;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.story-post__sub{
  margin-top: 6px;
  font-size: .9rem;
  color: #cbd5e1;
  display:flex;
  gap: 10px;
  align-items:center;
  flex-wrap: wrap;
}

.story-pill{
  display:inline-flex;
  align-items:center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 999px;
  font-size: .8rem;
  border: 1px solid rgba(148, 163, 184, .25);
  background: rgba(15,23,42,.6);
  color: #e5e7eb;
}

.story-post__body{
  padding: 0 16px 14px 16px;
}

.story-post__summary{
  margin: 0;
  color: #e5e7eb;
  font-size: .98rem;
  line-height: 1.55;
  opacity: .95;
}
.story-media{
  position: relative;
  width: 100%;
  background: rgba(2,6,23,.65);
  overflow: hidden;
  display:block;
  text-decoration:none;

  /* ✅ on retire le crop 16/9 */
  aspect-ratio: auto;
  max-height: 520px;   /* ajuste si tu veux 600px */
}

.story-media img{
  width: 100%;
  height: 520px;       /* même valeur que max-height */
  object-fit: contain; /* ✅ affiche tout l'image */
  display:block;
  background: rgba(2,6,23,.65); /* bandes noires soft si besoin */
}



.story-media__fallback{
  width: 100%;
  height: 100%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size: 2rem;
  opacity: .8;
}

.story-media__overlay{
  position:absolute;
  inset:0;
  background: linear-gradient(to top, rgba(2,6,23,.88), rgba(2,6,23,0) 55%);
}

.story-media__title{
  position:absolute;
  left: 14px;
  right: 14px;
  bottom: 12px;
  color: #fff;
  font-weight: 900;
  font-size: 1.25rem;
  text-shadow: 0 8px 25px rgba(0,0,0,.6);
}

.story-actions{
  display:flex;
  gap: 10px;
  padding: 12px 16px 16px 16px;
  border-top: 1px solid rgba(148, 163, 184, 0.18);
}

.story-btn{
  flex: 1 1 0;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap: 8px;
  padding: 10px 12px;
  border-radius: 12px;
  border: 1px solid rgba(148, 163, 184, .25);
  background: rgba(15,23,42,.55);
  color: #e5e7eb;
  cursor: pointer;
  text-decoration: none;
  font-weight: 900;
}

.story-btn:hover{
  transform: translateY(-1px);
  border-color: rgba(56,189,248,.45);
}

/* Pub slot propre */
.ad-slot{
  max-width: 860px;
  margin: 18px auto 0 auto;
  padding: 10px;
  border-radius: 16px;
  border: 1px dashed rgba(148,163,184,.25);
  background: rgba(15,23,42,.35);
}

/* Responsive */
@media (min-width: 980px){
  .stories-feed{ max-width: 900px; }
}

</style>
<body>
  <div id="siteHeader"></div>

  <!-- HERO / BARRE DE RECHERCHE -->
  <section class="stories-hero">
    <div class="container">
      <div class="stories-hero__top">
        <div class="stories-hero__title">
          <h1>Histoires & Bandes dessinées</h1>
          <p>Des séries en épisodes, du texte ou des BD en images — au format “post”, comme sur Facebook.</p>
        </div>

        <div class="stories-hero__right">
          <div class="stories-search">
            <label for="storySearch" class="sr-only">Rechercher une histoire</label>
            <input id="storySearch" type="search" placeholder="Rechercher une histoire…"
              oninput="StoriesPage.onStorySearch(this.value)">
            <button class="stories-btn" type="button" onclick="StoriesPage.onStoryClear()">Effacer</button>
          </div>

          <div class="stories-filters" role="group" aria-label="Filtres">
            <button type="button" class="filter-chip" data-kind="" onclick="StoriesPage.onStoryFilter('')">Toutes</button>
            <button type="button" class="filter-chip" data-kind="BD" onclick="StoriesPage.onStoryFilter('BD')">BD</button>
            <button type="button" class="filter-chip" data-kind="Histoire" onclick="StoriesPage.onStoryFilter('Histoire')">Histoire</button>
            <button type="button" class="filter-chip" data-kind="Épisode" onclick="StoriesPage.onStoryFilter('Épisode')">Épisode</button>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- FEED -->
  <section class="page-section">
    <div class="container">
      <div class="stories-feed" id="storiesGrid">
        <div class="empty-state">Chargement…</div>
      </div>

      <!-- Petit bloc pub optionnel (sans casser le design) -->
      <div class="ad-slot">
        <div id="adStoriesInline"></div>
      </div>
    </div>
  </section>

  <div id="siteFooter"></div>

  <script src="/assets/app.js"></script>
  <script src="/assets/stories.js"></script>

  <script>
    /* global SP */

const StoriesPage = (() => {
  const state = {
    all: [],
    view: [],
    filterKind: "",
    search: "",
  };

  // ---- Utils ----
  function qs(sel) { return document.querySelector(sel); }
  function qsa(sel) { return Array.from(document.querySelectorAll(sel)); }

  function safeText(v) {
    return String(v ?? "").replace(/[<>&]/g, s => ({ "<":"&lt;", ">":"&gt;", "&":"&amp;" }[s]));
  }

  function normalizeKind(v) {
    const raw = String(v ?? "").trim();
    const low = raw.toLowerCase();

    if (low === "bd") return "BD";
    if (low === "histoire") return "Histoire";
    if (low === "episode" || low === "épisode") return "Épisode";

    // parfois tu peux avoir "TEXTE" dans tes épisodes
    if (low === "texte") return "Histoire";

    return raw || "Histoire";
  }

  function initialsFromTitle(title = "H") {
    const t = String(title || "").trim();
    return (t[0] || "H").toUpperCase();
  }

  function pickCover(story) {
    // compat (coverUrl / cover_url / imageUrl / image_url)
    return story.coverUrl || story.cover_url || story.imageUrl || story.image_url || "";
  }

  function pickSummary(story) {
    return story.summary || story.description || story.excerpt || "";
  }

  function pickKind(story) {
    // compat (category / kind)
    return normalizeKind(story.category || story.kind || "");
  }

  function pickId(story) {
    return story.id;
  }

  function linkToStory(story) {
    // adapte si tu as une autre route (ex: /story.html?slug=...)
    if (story.slug) return `/story.html?slug=${encodeURIComponent(story.slug)}`;
    return `/story.html?id=${encodeURIComponent(pickId(story))}`;
  }

  function setEmpty(msg) {
    const grid = qs("#storiesGrid");
    if (!grid) return;
    grid.innerHTML = `<div class="empty-state">${safeText(msg)}</div>`;
  }

  function setError(msg) {
    const grid = qs("#storiesGrid");
    if (!grid) return;
    grid.innerHTML = `
      <div class="empty-state">
        <div style="font-weight:800; margin-bottom:.4rem;">Erreur</div>
        <div style="opacity:.9">${safeText(msg)}</div>
      </div>`;
  }

  // ---- Fetch ----
  async function fetchJson(url) {
    const res = await fetch(url, { method: "GET" });
    if (!res.ok) {
      const t = await res.text().catch(() => "");
      throw new Error(`${res.status} ${res.statusText} – ${t.slice(0, 200)}`);
    }
    return res.json();
  }

  async function loadStories() {
    // essaie plusieurs endpoints
    const candidates = [
      "/api/stories",
      "/api/histoires",
      "/api/story",
      "/api/episodes", // au cas où
    ];

    let lastErr = null;

    for (const url of candidates) {
      try {
        const data = await fetchJson(url);
        // formats possibles: {items:[...]} ou {stories:[...]} ou [...]
        const list = Array.isArray(data) ? data
          : Array.isArray(data.items) ? data.items
          : Array.isArray(data.stories) ? data.stories
          : Array.isArray(data.rows) ? data.rows
          : [];

        if (list.length) return list;
        // si endpoint ok mais vide, on accepte quand même
        if (Array.isArray(list)) return list;
      } catch (e) {
        lastErr = e;
      }
    }

    throw lastErr || new Error("Aucun endpoint ne répond.");
  }

  // ---- Render ----
  function pill(kind) {
    const k = normalizeKind(kind);
    // just un badge
    return `<span class="story-pill">${safeText(k)}</span>`;
  }

  function storyCardHTML(story) {
    const title = safeText(story.title || "Sans titre");
    const kind = pickKind(story);
    const summaryRaw = pickSummary(story);
    const summary = safeText(summaryRaw || "Découvre cette histoire sur Santé Planète.");
    const cover = pickCover(story);
    const link = linkToStory(story);

    return `
      <article class="story-post">
        <header class="story-post__head">
          <div class="story-post__avatar" aria-hidden="true">${initialsFromTitle(title)}</div>
          <div class="story-post__meta">
            <h3 class="story-post__title" title="${title}">${title}</h3>
            <div class="story-post__sub">
              ${pill(kind)}
              <span class="story-pill">Santé Planète</span>
            </div>
          </div>
        </header>

        <a class="story-media" href="${link}" aria-label="Ouvrir ${title}">
          ${cover ? `<img src="${cover}" alt="${title}" loading="lazy">` : `<div class="story-media__fallback">📚</div>`}
          <div class="story-media__overlay"></div>
          <div class="story-media__title">${title}</div>
        </a>

        <div class="story-post__body">
          <p class="story-post__summary">${summary}</p>
        </div>

        <div class="story-actions">
          <a class="story-btn" href="${link}">📖 Lire</a>
          <button class="story-btn" type="button" onclick="StoriesPage.shareStory('${String(pickId(story))}')">🔗 Partager</button>
        </div>
      </article>
    `;
  }

  function render(list) {
    const grid = qs("#storiesGrid");
    if (!grid) return;

    if (!list || !list.length) {
      setEmpty("Aucune histoire trouvée.");
      return;
    }

    grid.innerHTML = list.map(storyCardHTML).join("");
  }

  // ---- Filtering / search ----
  function applyView() {
    const f = normalizeKind(state.filterKind);
    const q = String(state.search || "").trim().toLowerCase();

    let list = [...state.all];

    if (f) {
      list = list.filter(s => normalizeKind(pickKind(s)) === f);
    }

    if (q) {
      list = list.filter(s => {
        const title = String(s.title || "").toLowerCase();
        const sum = String(pickSummary(s) || "").toLowerCase();
        const cat = String(pickKind(s) || "").toLowerCase();
        return title.includes(q) || sum.includes(q) || cat.includes(q);
      });
    }

    state.view = list;
    render(state.view);
  }

  function setActiveChip(kind) {
    const k = normalizeKind(kind);
    qsa(".filter-chip").forEach(btn => {
      const btnKind = normalizeKind(btn.getAttribute("data-kind") || "");
      const active = (k === "" && btnKind === "") || (k !== "" && btnKind === k);
      btn.classList.toggle("is-active", !!active);
    });
  }

  // ---- Public API ----
  async function loadStoriesPage() {
  try {
    if (window.SP?.mountHeader) SP.mountHeader("stories");
    if (window.SP?.mountFooter) SP.mountFooter();
  } catch (_) {}

  // ✅ 1) État par défaut : toutes + champ recherche vide
  state.filterKind = "";
  state.search = "";

  // ✅ 2) Active visuellement le chip "Toutes"
  setActiveChip("");

  setEmpty("Chargement…");

  try {
    const stories = await loadStories();
    state.all = stories || [];

    // ✅ 3) Applique la vue : donc "Toutes"
    applyView();
  } catch (e) {
    console.error(e);
    setError("Impossible de charger les histoires. Vérifie ton endpoint /api/stories et ta base.");
  }
}

  function onStoryFilter(kind) {
    state.filterKind = kind || "";
    setActiveChip(state.filterKind);
    applyView();
  }

  function onStorySearch(value) {
    state.search = value || "";
    applyView();
  }

  function onStoryClear() {
    const input = qs("#storySearch");
    if (input) input.value = "";
    state.search = "";
    state.filterKind = "";
    setActiveChip("");
    applyView();
  }

  async function shareStory(id) {
    try {
      // On partage la page story
      const url = `${location.origin}/story.html?id=${encodeURIComponent(id)}`;
      if (navigator.share) {
        await navigator.share({ title: "Santé Planète", url });
        return;
      }
      await navigator.clipboard.writeText(url);
      alert("Lien copié !");
    } catch (e) {
      console.error(e);
      alert("Impossible de partager pour le moment.");
    }
  }

  return {
    loadStoriesPage,
    onStoryFilter,
    onStorySearch,
    onStoryClear,
    shareStory,
  };
})();

window.StoriesPage = StoriesPage;

    document.addEventListener("DOMContentLoaded", () => {
      StoriesPage.loadStoriesPage();
    });
  </script>
