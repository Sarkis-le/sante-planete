<style>
  /* =========================
   BASE (pour cette page)
========================= */
:root{
  --bg0:#020617;
  --bg1:#0b1224;
  --card: rgba(15,23,42,.62);
  --card2: rgba(2,6,23,.40);
  --border: rgba(148,163,184,.18);
  --text:#e5e7eb;
  --muted:#cbd5e1;
  --accent:#38bdf8;
  --accentSoft: rgba(56,189,248,.16);
  --shadow: 0 18px 60px rgba(0,0,0,.22);
  --radius: 22px;
}

*{ box-sizing: border-box; }
img{ max-width: 100%; }

/* container fallback si styles.css n’en a pas */
.container{
  width: min(1120px, calc(100% - 32px));
  margin: 0 auto;
}

/* =========================
   HERO + SEARCH
========================= */
.stories-hero{
  background: radial-gradient(900px 420px at 18% 0%, rgba(56,189,248,.22), transparent 55%),
              radial-gradient(900px 420px at 82% 0%, rgba(168,85,247,.22), transparent 55%),
              linear-gradient(135deg, var(--bg0), var(--bg1), #1e293b);
  color: var(--text);
  padding: 44px 0 28px 0;
  border-bottom: 1px solid rgba(148,163,184,.14);
}

.stories-hero__top{
  display:flex;
  gap: 18px;
  align-items:flex-end;
  justify-content: space-between;
  flex-wrap: wrap;
}

.stories-hero__title h1{
  margin: 0;
  font-size: 1.85rem;
  font-weight: 950;
  letter-spacing: .2px;
}

.stories-hero__title p{
  margin: .55rem 0 0 0;
  color: rgba(203,213,225,.92);
  max-width: 68ch;
  line-height: 1.55;
}

.stories-hero__right{
  flex: 1 1 420px;
  display:flex;
  flex-direction: column;
  gap: 12px;
  align-items:flex-start;
}

.stories-search{
  display:flex;
  gap: 10px;
  align-items:center;
  flex-wrap: wrap;
  width: 100%;
}

.stories-search input{
  flex: 1 1 360px;
  width: min(560px, 90vw);
  padding: 12px 14px;
  border-radius: 16px;
  border: 1px solid rgba(148,163,184,.22);
  background: rgba(2,6,23,.38);
  color: var(--text);
  outline: none;
  box-shadow: 0 10px 30px rgba(0,0,0,.12);
}

.stories-search input::placeholder{
  color: rgba(203,213,225,.75);
}

.stories-search input:focus{
  border-color: rgba(56,189,248,.45);
  box-shadow: 0 0 0 4px rgba(56,189,248,.16);
}

.stories-btn{
  padding: 12px 14px;
  border-radius: 16px;
  border: 1px solid rgba(56,189,248,.32);
  background: rgba(56,189,248,.14);
  color: var(--text);
  font-weight: 900;
  cursor: pointer;
  transition: transform .12s ease, border-color .12s ease;
}

.stories-btn:hover{
  transform: translateY(-1px);
  border-color: rgba(56,189,248,.45);
}

/* =========================
   FILTER CHIPS
========================= */
.stories-filters{
  display:flex;
  gap: 10px;
  flex-wrap: wrap;
}

.filter-chip{
  padding: 8px 12px;
  border-radius: 999px;
  border: 1px solid rgba(148,163,184,.22);
  background: rgba(2,6,23,.28);
  color: var(--text);
  font-weight: 900;
  cursor:pointer;
  transition: transform .12s ease, border-color .12s ease, background .12s ease;
  user-select: none;
}

.filter-chip:hover{
  transform: translateY(-1px);
  border-color: rgba(56,189,248,.30);
}

.filter-chip.is-active{
  border-color: rgba(56,189,248,.55);
  background: rgba(56,189,248,.18);
}

/* =========================
   PAGE SECTION
========================= */
.page-section{
  padding: 22px 0 42px 0;
}

/* =========================
   FEED GRID
========================= */
.stories-feed{
  display: grid;
  gap: 18px;
  max-width: 1120px;
  margin: 0 auto;
}

@media (min-width: 900px){
  .stories-feed{
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

@media (min-width: 1250px){
  .stories-feed{
    gap: 22px;
  }
}

/* =========================
   CARD POST (STYLE SOCIAL)
========================= */
.story-post{
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  box-shadow: var(--shadow);
  backdrop-filter: blur(8px);
  transition: transform .15s ease, border-color .15s ease;
}

.story-post:hover{
  transform: translateY(-2px);
  border-color: rgba(56,189,248,.35);
}

/* header mini */
.story-post__head{
  display:flex;
  align-items:center;
  gap: 12px;
  padding: 12px 14px;
}

.story-post__avatar{
  width: 40px;
  height: 40px;
  border-radius: 999px;
  background: rgba(56,189,248,.14);
  border: 1px solid rgba(56,189,248,.35);
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight: 950;
  color: var(--text);
  flex: 0 0 auto;
}

.story-post__meta{
  flex: 1 1 auto;
  min-width: 0;
}

.story-post__title{
  margin: 0;
  font-size: 1.02rem;
  font-weight: 950;
  color: #fff;
  line-height: 1.2;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.story-post__sub{
  margin-top: 6px;
  display:flex;
  gap: 8px;
  align-items:center;
  flex-wrap: wrap;
  font-size: .86rem;
  color: rgba(226,232,240,.92);
}

.story-pill{
  display:inline-flex;
  align-items:center;
  padding: 4px 10px;
  border-radius: 999px;
  border: 1px solid rgba(148,163,184,.16);
  background: var(--card2);
}

/* =========================
   MEDIA (IMAGE ENTIÈRE)
   - Jamais coupée
========================= */
.story-media{
  position: relative;
  width: 100%;
  aspect-ratio: 4 / 5;               /* post style */
  background: rgba(2,6,23,.82);      /* bandes */
  overflow: hidden;
  display:block;
  text-decoration:none;
  border-top: 1px solid rgba(148,163,184,.10);
  border-bottom: 1px solid rgba(148,163,184,.10);
}

.story-media img{
  width: 100%;
  height: 100%;
  object-fit: contain;               /* ✅ image entière */
  display:block;
  background: rgba(2,6,23,.82);
}

/* overlay soft + titre */
.story-media__overlay{
  position:absolute;
  inset:0;
  background: linear-gradient(to top, rgba(2,6,23,.78), rgba(2,6,23,0) 55%);
  pointer-events:none;
}

.story-media__title{
  position:absolute;
  left: 14px;
  right: 14px;
  bottom: 12px;
  color: #fff;
  font-weight: 950;
  font-size: 1.12rem;
  text-shadow: 0 10px 28px rgba(0,0,0,.55);
  line-height: 1.25;
  pointer-events:none;
}

/* fallback si pas d’image */
.story-media__fallback{
  width: 100%;
  height: 100%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size: 2rem;
  opacity: .85;
}

/* =========================
   BODY (résumé court)
========================= */
.story-post__body{
  padding: 12px 14px 6px 14px;
}

.story-post__summary{
  margin: 0;
  color: rgba(226,232,240,.94);
  font-size: .95rem;
  line-height: 1.55;

  /* clamp 3 lignes */
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

/* =========================
   ACTIONS
========================= */
.story-actions{
  display:flex;
  justify-content:flex-end;
  gap: 10px;
  padding: 10px 14px 14px 14px;
}

.story-btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap: 8px;
  padding: 10px 12px;
  border-radius: 14px;
  border: 1px solid rgba(148,163,184,.18);
  background: rgba(2,6,23,.35);
  color: var(--text);
  cursor: pointer;
  text-decoration: none;
  font-weight: 900;
  min-width: 120px;
  transition: transform .12s ease, border-color .12s ease, background .12s ease;
}

.story-btn:hover{
  transform: translateY(-1px);
  border-color: rgba(56,189,248,.35);
  background: rgba(56,189,248,.08);
}

/* =========================
   EMPTY + ADS SLOT
========================= */
.empty-state{
  background: rgba(2,6,23,.08);
  border: 1px dashed rgba(148,163,184,.25);
  border-radius: 16px;
  padding: 18px;
  color: rgba(15,23,42,.82);
}

@media (prefers-color-scheme: dark){
  .empty-state{
    background: rgba(15,23,42,.32);
    color: rgba(226,232,240,.9);
  }
}

.ad-slot{
  max-width: 1120px;
  margin: 18px auto 0 auto;
  padding: 10px;
  border-radius: 16px;
  border: 1px dashed rgba(148,163,184,.22);
  background: rgba(15,23,42,.25);
}

/* accessibilité */
.sr-only{
  position:absolute;
  width:1px;
  height:1px;
  padding:0;
  margin:-1px;
  overflow:hidden;
  clip:rect(0,0,0,0);
  white-space:nowrap;
  border:0;
}

</style>

  <!-- HERO / BARRE DE RECHERCHE -->
  <section class="stories-hero">
    <div class="container">
      <div class="stories-hero__top">
        <div class="stories-hero__title">
          <h1>Histoires & Bandes dessinées</h1>
          <p>Des séries en épisodes, du texte ou des BD en images.</p>
        </div>

        <div class="stories-hero__right">
          <div class="stories-search">

              oninput="StoriesPage.onStorySearch(this.value)">

          </div>

          <div class="stories-filters" role="group" aria-label="Filtres">
            <button type="button" class="filter-chip is-active" data-kind="" onclick="StoriesPage.onStoryFilter('')">Toutes</button>
            <button type="button" class="filter-chip no-active" data-kind="BD" onclick="StoriesPage.onStoryFilter('BD')">BD</button>
            <button type="button" class="filter-chip no-active" data-kind="Histoire" onclick="StoriesPage.onStoryFilter('Histoire')">Histoire</button>
            <button type="button" class="filter-chip no-active" data-kind="Épisode" onclick="StoriesPage.onStoryFilter('Épisode')">Épisode</button>

  <!-- FEED -->
  <section class="page-section">
    <div class="container">
      <div class="stories-feed" id="storiesGrid">

      </div>

  <script>
    /* global SP */

const StoriesPage = (() => {
  const state = {
    all: [],
    view: [],
    filterKind: "",
    search: "",
  };

  // ---- Utils ----
  function qs(sel) { return document.querySelector(sel); }
  function qsa(sel) { return Array.from(document.querySelectorAll(sel)); }

  function safeText(v) {
    return String(v ?? "").replace(/[<>&]/g, s => ({ "<":"&lt;", ">":"&gt;", "&":"&amp;" }[s]));
  }
function normalizeKind(v) {
  const raw = String(v ?? "").trim();
  if (!raw) return "";              // ✅ important : vide reste vide

  const low = raw.toLowerCase();
  if (low === "bd") return "BD";
  if (low === "histoire") return "Histoire";
  if (low === "episode" || low === "épisode") return "Épisode";
  if (low === "texte") return "Histoire";
  return raw;
}

  function initialsFromTitle(title = "H") {
    const t = String(title || "").trim();
    return (t[0] || "H").toUpperCase();
  }

  function pickCover(story) {
    // compat (coverUrl / cover_url / imageUrl / image_url)
    return story.coverUrl || story.cover_url || story.imageUrl || story.image_url || "";
  }

  function pickSummary(story) {
    return story.summary || story.description || story.excerpt || "";
  }

  function pickKind(story) {
    // compat (category / kind)
    return normalizeKind(story.category || story.kind || "");
  }

  function pickId(story) {
    return story.id;
  }

  function linkToStory(story) {
    // adapte si tu as une autre route (ex: /story.html?slug=...)
    if (story.slug) return `/story.html?slug=${encodeURIComponent(story.slug)}`;
    return `/story.html?id=${encodeURIComponent(pickId(story))}`;
  }

  function setEmpty(msg) {
    const grid = qs("#storiesGrid");
    if (!grid) return;
    grid.innerHTML = `<div class="empty-state">${safeText(msg)}</div>`;
  }

  function setError(msg) {
    const grid = qs("#storiesGrid");
    if (!grid) return;
    grid.innerHTML = `
      <div class="empty-state">
        <div style="font-weight:800; margin-bottom:.4rem;">Erreur</div>
        <div style="opacity:.9">${safeText(msg)}</div>
      </div>`;
  }

  // ---- Fetch ----
  async function fetchJson(url) {
    const res = await fetch(url, { method: "GET" });
    if (!res.ok) {
      const t = await res.text().catch(() => "");
      throw new Error(`${res.status} ${res.statusText} – ${t.slice(0, 200)}`);
    }
    return res.json();
  }

  async function loadStories() {
    // essaie plusieurs endpoints
    const candidates = [
      "/api/stories",
      "/api/histoires",
      "/api/story",
      "/api/episodes", // au cas où
    ];

    let lastErr = null;

    for (const url of candidates) {
      try {
        const data = await fetchJson(url);
        // formats possibles: {items:[...]} ou {stories:[...]} ou [...]
        const list = Array.isArray(data) ? data
          : Array.isArray(data.items) ? data.items
          : Array.isArray(data.stories) ? data.stories
          : Array.isArray(data.rows) ? data.rows
          : [];

        if (list.length) return list;
        // si endpoint ok mais vide, on accepte quand même
        if (Array.isArray(list)) return list;
      } catch (e) {
        lastErr = e;
      }
    }

    throw lastErr || new Error("Aucun endpoint ne répond.");
  }

 function pill(kind) {
  const k = normalizeKind(kind) || "Histoire"; // ✅ si vide => badge "Histoire"
  return `<span class="story-pill">${safeText(k)}</span>`;
}


  function storyCardHTML(story) {
    const title = safeText(story.title || "Sans titre");
    const kind = pickKind(story);
    const summaryRaw = pickSummary(story);
    const summary = safeText(summaryRaw || "Découvre cette histoire sur Santé Planète.");
    const cover = pickCover(story);
    const link = linkToStory(story);

    return `
      <article class="story-post">
        <header class="story-post__head">
          <div class="story-post__avatar" aria-hidden="true">${initialsFromTitle(title)}</div>
          <div class="story-post__meta">
            <h3 class="story-post__title" title="${title}">${title}</h3>
            <div class="story-post__sub">
              ${pill(kind)}
              <span class="story-pill">Santé Planète</span>
            </div>
          </div>
        </header>

        <a class="story-media" href="${link}" aria-label="Ouvrir ${title}">
          ${cover ? `<img src="${cover}" alt="${title}" loading="lazy">` : `<div class="story-media__fallback">📚</div>`}
          <div class="story-media__overlay"></div>
          <div class="story-media__title">${title}</div>
        </a>

        <div class="story-post__body">
          <p class="story-post__summary">${summary}</p>
        </div>

        <div class="story-actions">
          <a class="story-btn" href="${link}">📖 Lire</a>
          <button class="story-btn" type="button" onclick="StoriesPage.shareStory('${String(pickId(story))}')">🔗 Partager</button>
        </div>
      </article>
    `;
  }

  function render(list) {
    const grid = qs("#storiesGrid");
    if (!grid) return;

    if (!list || !list.length) {
      setEmpty("Aucune histoire trouvée.");
      return;
    }

    grid.innerHTML = list.map(storyCardHTML).join("");
  }

  // ---- Filtering / search ----
  function applyView() {
    const f = normalizeKind(state.filterKind);
    const q = String(state.search || "").trim().toLowerCase();

    let list = [...state.all];

    if (f) {
      list = list.filter(s => normalizeKind(pickKind(s)) === f);
    }

    if (q) {
      list = list.filter(s => {
        const title = String(s.title || "").toLowerCase();
        const sum = String(pickSummary(s) || "").toLowerCase();
        const cat = String(pickKind(s) || "").toLowerCase();
        return title.includes(q) || sum.includes(q) || cat.includes(q);
      });
    }

    state.view = list;
    render(state.view);
  }

  function setActiveChip(kind) {
    const k = normalizeKind(kind);
    qsa(".filter-chip").forEach(btn => {
      const btnKind = normalizeKind(btn.getAttribute("data-kind") || "");
      const active = (k === "" && btnKind === "") || (k !== "" && btnKind === k);
      btn.classList.toggle("is-active", !!active);
    });
  }

  // ---- Public API ----
  async function loadStoriesPage() {
  try {
    if (window.SP?.mountHeader) SP.mountHeader("stories");
    if (window.SP?.mountFooter) SP.mountFooter();
  } catch (_) {}

  // ✅ FORCE l’état initial
  state.filterKind = "";
  state.search = "";
  setActiveChip("");

  setEmpty("Chargement…");

  try {
    const stories = await loadStories();
    state.all = stories || [];
    applyView();
  } catch (e) {
    console.error(e);
    setError("Impossible de charger les histoires. Vérifie ton endpoint /api/stories et ta base.");
  }
}


  function onStoryFilter(kind) {
    state.filterKind = kind || "";
    setActiveChip(state.filterKind);
    applyView();
  }

  function onStorySearch(value) {
    state.search = value || "";
    applyView();
  }

  function onStoryClear() {
    const input = qs("#storySearch");
    if (input) input.value = "";
    state.search = "";
    state.filterKind = "";
    setActiveChip("");
    applyView();
  }

  async function shareStory(id) {
    try {
      // On partage la page story
      const url = `${location.origin}/story.html?id=${encodeURIComponent(id)}`;
      if (navigator.share) {
        await navigator.share({ title: "Santé Planète", url });
        return;
      }
      await navigator.clipboard.writeText(url);
      alert("Lien copié !");
    } catch (e) {
      console.error(e);
      alert("Impossible de partager pour le moment.");
    }
  }

  return {
    loadStoriesPage,
    onStoryFilter,
    onStorySearch,
    onStoryClear,
    shareStory,
  };
})();

window.StoriesPage = StoriesPage;

  </script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      StoriesPage.loadStoriesPage();
    });
  </script>
